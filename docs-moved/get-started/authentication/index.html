<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>The RAD docs have moved</title>
        <meta http-equiv="refresh" content="3; url=https://daikin-dsv.github.io/rad-platform/docs/get-started/authentication/" />
        <link rel="canonical" href="https://daikin-dsv.github.io/rad-platform/docs/get-started/authentication/" />
        <meta name="robots" content="noindex" />
        <script>
            // Redirect promptly while preserving any in-page #anchor and query.
            window.location.replace('https://daikin-dsv.github.io/rad-platform/docs/get-started/authentication/'.replace(/\/$/, '') + '/' + window.location.search + window.location.hash);
        </script>
        <style>
            :root {
                color-scheme: light dark;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family:
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    Roboto,
                    Helvetica,
                    Arial,
                    sans-serif;
                background: #f5f6f8;
                color: #1a1a1a;
            }
            @media (prefers-color-scheme: dark) {
                body {
                    background: #1b1b1d;
                    color: #f5f6f8;
                }
            }
            main {
                max-width: 32rem;
                padding: 2rem 1.5rem;
                text-align: center;
            }
            h1 {
                font-size: 1.6rem;
                margin: 0 0 0.75rem;
            }
            p {
                font-size: 1rem;
                line-height: 1.5;
                margin: 0 0 1.25rem;
            }
            a.button {
                display: inline-block;
                padding: 0.65rem 1.25rem;
                border-radius: 0.5rem;
                background: #0a7ea4;
                color: #fff;
                text-decoration: none;
                font-weight: 600;
            }
            a.button:hover {
                background: #086685;
            }
            .muted {
                font-size: 0.85rem;
                opacity: 0.7;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>The RAD documentation has moved</h1>
            <p>
                These docs now live in the
                <strong>rad-platform</strong> repository. You will be redirected
                automatically in a few seconds.
            </p>
            <p>
                <a class="button" href="https://daikin-dsv.github.io/rad-platform/docs/get-started/authentication/">Go to the new RAD docs</a>
            </p>
            <p class="muted">
                If you are not redirected, visit
                <a href="https://daikin-dsv.github.io/rad-platform/docs/get-started/authentication/">https://daikin-dsv.github.io/rad-platform/docs/get-started/authentication/</a>
            </p>
        </main>
    </body>
</html>
